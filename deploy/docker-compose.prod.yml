version: "3.8"

# ═══════════════════════════════════════════════════════════════════════════════
# CYBER CONSTELLATION — PRODUCTION DOCKER COMPOSE
# All image versions pinned. Log rotation enabled. DB connection pooling tuned.
# Last tested: 2026-04 | n8n 1.44.1 | PostgreSQL 16.3 | Redis 7.2
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  constellation:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  grafana_data:
    driver: local
  sentinel_logs:
    driver: local
  nginx_logs:
    driver: local

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"
    labels: "service"

services:

  # ─── POSTGRESQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.3-alpine
    container_name: constellation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-constellation}
      POSTGRES_USER: ${POSTGRES_USER:-constellation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    command: |
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c max_connections=100
        -c wal_level=replica
        -c max_wal_size=1GB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c log_min_duration_statement=1000
        -c log_connections=on
        -c log_disconnections=on
        -c log_lock_waits=on
        -c autovacuum=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db_COMPLETE.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./scripts/init_multitenancy.sql:/docker-entrypoint-initdb.d/02_multitenancy.sql:ro
    networks:
      constellation:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-constellation} -d ${POSTGRES_DB:-constellation}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    labels:
      - "service=postgres"

  # ─── REDIS 7.2 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2.4-alpine
    container_name: constellation-redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?required}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --loglevel warning
        --tcp-keepalive 60
        --timeout 300
    volumes:
      - redis_data:/data
    networks:
      constellation:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    labels:
      - "service=redis"

  # ─── N8N 1.44.1 ─────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.44.1
    container_name: constellation-n8n
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-constellation}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-constellation}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?required}
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: last
      EXECUTIONS_DATA_MAX_AGE: 336
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_METRICS: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      constellation:
        ipv4_address: 172.20.0.20
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    labels:
      - "service=n8n"

  # ─── N8N WORKER ─────────────────────────────────────────────────────────────
  n8n-worker:
    image: n8nio/n8n:1.44.1
    container_name: constellation-n8n-worker
    restart: unless-stopped
    command: n8n worker --concurrency=5
    depends_on:
      n8n: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-constellation}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-constellation}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      NODE_OPTIONS: "--max-old-space-size=1024"
    networks:
      constellation:
        ipv4_address: 172.20.0.21
    logging: *default-logging
    labels:
      - "service=n8n-worker"

  # ─── SENTINEL API ──────────────────────────────────────────────────────────
  sentinel-api:
    build:
      context: ./sentinel-api
      dockerfile: Dockerfile
    image: constellation-sentinel-api:latest
    container_name: constellation-sentinel-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-constellation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-constellation}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?required}
      N8N_INTERNAL_URL: http://n8n:5678
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-120}
    volumes:
      - sentinel_logs:/app/logs
    networks:
      constellation:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | grep -q '\"ok\":true'"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *default-logging
    labels:
      - "service=sentinel-api"

  # ─── GRAFANA 10.4 ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: constellation-grafana
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?required}
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: ${POSTGRES_DB:-constellation}
      GF_DATABASE_USER: ${POSTGRES_USER:-constellation}
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://yourdomain.com/grafana/}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      TZ: Asia/Kolkata
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      constellation:
        ipv4_address: 172.20.0.40
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging
    labels:
      - "service=grafana"

  # ─── NGINX (TLS TERMINATION) ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.25.4-alpine
    container_name: constellation-nginx
    restart: unless-stopped
    depends_on:
      - n8n
      - sentinel-api
      - grafana
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      constellation:
        ipv4_address: 172.20.0.60
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    labels:
      - "service=nginx"

  # ─── UPTIME KUMA 1.23 ────────────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.11
    container_name: constellation-uptime
    restart: unless-stopped
    volumes:
      - ./uptime-kuma:/app/data
    networks:
      constellation:
        ipv4_address: 172.20.0.50
    ports:
      - "3001:3001"
    logging: *default-logging

  # ─── LOGROTATE SIDECAR ───────────────────────────────────────────────────────
  logrotate:
    image: alpine:3.19.1
    container_name: constellation-logrotate
    restart: unless-stopped
    volumes:
      - sentinel_logs:/logs/sentinel
      - nginx_logs:/logs/nginx
    command: >
      sh -c "
        cat > /etc/logrotate.conf << 'EOF'
        /logs/sentinel/*.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root root
        }
        /logs/nginx/*.log {
          daily
          rotate 30
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root root
        }
        EOF
        while true; do
          logrotate /etc/logrotate.conf
          sleep 86400
        done
      "
    networks:
      - constellation
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "2"

  # ─── SCHEDULED BACKUP ────────────────────────────────────────────────────────
  backup:
    image: postgres:16.3-alpine
    container_name: constellation-backup
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-constellation}
      POSTGRES_DB: ${POSTGRES_DB:-constellation}
    volumes:
      - ./backups:/backups
    command: >
      sh -c "
        while true; do
          BACKUP_FILE=/backups/constellation-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > $$BACKUP_FILE
          echo \"Backup created: $$BACKUP_FILE ($$(du -sh $$BACKUP_FILE | cut -f1))\"
          # Keep last 14 days
          find /backups -name '*.sql.gz' -mtime +14 -delete
          # Sleep 6 hours
          sleep 21600
        done
      "
    networks:
      - constellation
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
