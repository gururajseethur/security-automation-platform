events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # ─── Basic Settings ────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Don't reveal nginx version

    # ─── Rate Limiting Zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ─── Logging ───────────────────────────────────────────────────────────────
    log_format constellation '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rt=$request_time tenant=$http_x_constellation_tenant';
    access_log /var/log/nginx/constellation.access.log constellation;
    error_log  /var/log/nginx/constellation.error.log warn;

    # ─── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # ─── SSL Settings ─────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Security Headers (apply to all responses) ────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── HTTP → HTTPS Redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── SENTINEL Dashboard + API ─────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN:-constellation.yourdomain.com};

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        limit_conn addr 50;

        # ── Sentinel API ────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://sentinel-api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_connect_timeout 10;

            # Remove internal headers before forwarding
            proxy_hide_header X-Powered-By;
        }

        # ── Auth endpoint (stricter rate limit) ──────────────────────────────
        location /auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://sentinel-api:8000/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Webhook receiver ─────────────────────────────────────────────────
        location /webhook/ {
            limit_req zone=webhook burst=50 nodelay;

            # Only allow from known n8n IPs or internal network
            allow 172.20.0.0/24;   # Docker constellation network
            allow 127.0.0.1;
            # add your server IPs here
            deny all;

            proxy_pass http://sentinel-api:8000/api/v1/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30;
            client_max_body_size 1m;
        }

        # ── Health check (public, no rate limit) ─────────────────────────────
        location /health {
            proxy_pass http://sentinel-api:8000/health;
            access_log off;
        }

        # ── n8n (admin only — restrict by IP in production) ──────────────────
        location /n8n/ {
            limit_req zone=api burst=10 nodelay;

            # Restrict n8n to admin IPs only
            # allow YOUR_ADMIN_IP;
            # deny all;

            proxy_pass http://n8n:5678/;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300;
        }

        # ── Grafana ───────────────────────────────────────────────────────────
        location /grafana/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Block common attack paths ─────────────────────────────────────────
        location ~* \.(env|git|htaccess|htpasswd|sql|bak|log)$ {
            return 404;
        }
        location ~ /\. { return 404; }
    }

    # ─── Grafana subdomain (optional) ─────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name grafana.${DOMAIN:-yourdomain.com};

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
