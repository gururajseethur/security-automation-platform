[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation-sentinel-api"
version = "2.0.0"
description = "FastAPI backend for the Cyber Constellation Sentinel service"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "PyJWT>=2.8.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
